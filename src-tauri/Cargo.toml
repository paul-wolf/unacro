[package]
name = "unacro"
version = "0.1.0"
description = "A small, fast, open-source PDF tool"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "unacro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Linux and Windows only: macOS already keeps one instance per app and sends
# double-clicked files to it as "open document" events.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Printing Markdown to PDF with the system web view (src/print.rs). These are the
# same crates Tauri itself uses, so they add no new code to the app.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSValue", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSView", "NSWindow", "NSResponder", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }
