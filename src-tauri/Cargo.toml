[package]
name = "unacro"
version = "0.1.0"
description = "A small, fast, open-source PDF tool"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "unacro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Linux and Windows only: macOS already keeps one instance per app and sends
# double-clicked files to it as "open document" events.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
