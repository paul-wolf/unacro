# Build installers for macOS, Linux and Windows and attach them to a draft
# GitHub release. Runs when a version tag like v0.2.0 is pushed (see
# "Releasing" in the README), or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04 # older glibc, so the Linux builds run on more distributions
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}"
            exit 1
          fi

      - name: Install system libraries for Tauri
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Unacro v__VERSION__
          releaseBody: |
            Download the installer for your system below.

            - **macOS:** `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel). The app isn't notarized yet: if macOS says it can't be opened, go to System Settings → Privacy & Security and click "Open Anyway", or run `xattr -dr com.apple.quarantine /Applications/Unacro.app`.
            - **Linux:** `.AppImage` (runs anywhere), `.deb` (Debian, Ubuntu) or `.rpm` (Fedora, openSUSE).
            - **Windows:** `.msi` or `-setup.exe`. Windows may warn that the app is unrecognised: click "More info", then "Run anyway".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
